name = "neort-gc-symbolics"
version = "0.1.0"
license = "MIT"

[dependencies]
fortsym = { git = "https://github.com/lazy-fortran/fortsym.git", rev = "58a0e06c95ecc943dfdcb044b7ca6a9964c1c55d" }

[build]
auto-executables = true
link = ["symengine", "flint", "mpfr", "gmp", "stdc++", "dl"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name = "gen_manufactured_torus"
source-dir = "app"
main = "gen_manufactured_torus.f90"
