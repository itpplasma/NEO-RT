name = "neort-gc-symbolics"
version = "0.1.0"
license = "MIT"

[dependencies]
fortsym = { git = "https://github.com/lazy-fortran/fortsym.git", rev = "545788453a204d58705f735b519c3863c2f734c8" }

[build]
auto-executables = true
link = ["symengine", "flint", "mpfr", "gmp", "stdc++", "dl"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name = "gen_manufactured_torus"
source-dir = "app"
main = "gen_manufactured_torus.f90"

[[executable]]
name = "gen_potato_kernels"
source-dir = "app"
main = "gen_potato_kernels.f90"

[[executable]]
name = "gen_full_fow_physics"
source-dir = "app"
main = "gen_full_fow_physics.f90"

[[executable]]
name = "gen_gc_class_coordinate_map"
source-dir = "app"
main = "gen_gc_class_coordinate_map.f90"

[[executable]]
name = "gen_circular_flux_continuation"
source-dir = "app"
main = "gen_circular_flux_continuation.f90"
