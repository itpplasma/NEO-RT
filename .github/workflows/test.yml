name: NEO-RT

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  merge_group:

  # Allows you to run this workflow manually, and lets an upstream libneo
  # release dispatch it against a candidate ref.
  workflow_dispatch:
    inputs:
      libneo_ref:
        description: libneo branch, tag or commit to build against
        required: false
        default: ''

  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  standalone-off:
    name: Reject unsupported native NEO-2 build
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || fromJSON('["self-hosted","itp-build"]') }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          SCI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SCI_LIBNEO_REF: ${{ inputs.libneo_ref }}
          SCI_RUN_GOLDEN: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh test-standalone-off
      - name: Check OFF configure diagnostic without fetching dependencies
        run: |
          if cmake -S . -B build-off -DUSE_STANDALONE=OFF > configure-off.log 2>&1; then
            cat configure-off.log
            echo "Expected USE_STANDALONE=OFF to fail"
            exit 1
          fi
          cat configure-off.log
          grep -F "USE_STANDALONE=OFF is currently unsupported" configure-off.log
          test ! -d build-off/OBJS/_deps

        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  build_Fast:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || fromJSON('["self-hosted","itp-dispatch"]') }}

    steps:
      - uses: actions/checkout@v6

        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          SCI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SCI_LIBNEO_REF: ${{ inputs.libneo_ref }}
          SCI_MATRIX_CONFIG: Fast
          SCI_RUN_GOLDEN: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          export TMPDIR=$RUNNER_TEMP
          SCI_TIER=test-build ci/bundle.sh "$RUNNER_TEMP/native.tar.zst"
          sci-dispatch native "$RUNNER_TEMP/native.tar.zst"
      - name: Install build dependencies
        run: |
          make deps

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Install Python test dependencies
        run: |
          pip install pytest numpy h5py f90nml scipy

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build code
        run: |
          make CONFIG=Fast${{ inputs.libneo_ref && format(' LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Run ctest
        run: |
          make ctest

    # The libneo gate dispatches this workflow (report-only) and wants only the
    # fast ctest tier; the golden-record pytest is the slow suite and stays on
    # NEO-RT's merge-queue runs (full tier). Pull requests, including stacked
    # layers, skip it unless labeled full-ci.
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Run pytest (all tests for Fast)
        if: ${{ github.event.pull_request.head.repo.fork && (github.event_name != 'workflow_dispatch' && 'Fast' == 'Fast' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
        run: |
          make pytest

      - name: Run pytest (skip golden record for Debug)
        if: ${{ github.event.pull_request.head.repo.fork && (github.event_name != 'workflow_dispatch' && 'Fast' != 'Fast' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
        run: |
          pytest -m "not fast_only"
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: build (Fast)
  build_Debug:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || fromJSON('["self-hosted","itp-dispatch"]') }}

    steps:
      - uses: actions/checkout@v6

        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          SCI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SCI_LIBNEO_REF: ${{ inputs.libneo_ref }}
          SCI_MATRIX_CONFIG: Debug
          SCI_RUN_GOLDEN: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          export TMPDIR=$RUNNER_TEMP
          SCI_TIER=test-build ci/bundle.sh "$RUNNER_TEMP/native.tar.zst"
          sci-dispatch native "$RUNNER_TEMP/native.tar.zst"
      - name: Install build dependencies
        run: |
          make deps

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Install Python test dependencies
        run: |
          pip install pytest numpy h5py f90nml scipy

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build code
        run: |
          make CONFIG=Debug${{ inputs.libneo_ref && format(' LIBNEO_REF={0}', inputs.libneo_ref) || '' }}

        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Run ctest
        run: |
          make ctest

    # The libneo gate dispatches this workflow (report-only) and wants only the
    # fast ctest tier; the golden-record pytest is the slow suite and stays on
    # NEO-RT's merge-queue runs (full tier). Pull requests, including stacked
    # layers, skip it unless labeled full-ci.
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Run pytest (all tests for Fast)
        if: ${{ github.event.pull_request.head.repo.fork && (github.event_name != 'workflow_dispatch' && 'Debug' == 'Fast' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
        run: |
          make pytest

      - name: Run pytest (skip golden record for Debug)
        if: ${{ github.event.pull_request.head.repo.fork && (github.event_name != 'workflow_dispatch' && 'Debug' != 'Fast' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
        run: |
          pytest -m "not fast_only"
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: build (Debug)
  build_POTATO:
    name: build (POTATO)
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || fromJSON('["self-hosted","itp-dispatch"]') }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build POTATO and run its native CTest suite
        env:
          SCI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          SCI_LIBNEO_REF: ${{ inputs.libneo_ref }}
          SCI_RUN_GOLDEN: 'false'
        run: |-
          export TMPDIR=$RUNNER_TEMP
          SCI_TIER=test-potato ci/bundle.sh "$RUNNER_TEMP/native.tar.zst"
          sci-dispatch native "$RUNNER_TEMP/native.tar.zst"
  build-result:
    name: build
    needs: [build_Fast, build_Debug, build_POTATO, standalone-off]
    if: >-
      always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-merge-queue[bot]'))
    runs-on: [self-hosted, itp-light]
    steps:
      - env:
          FAST: ${{ needs.build_Fast.result }}
          DEBUG: ${{ needs.build_Debug.result }}
          POTATO: ${{ needs.build_POTATO.result }}
          OFF: ${{ needs.standalone-off.result }}
        run: test "$FAST" = success && test "$DEBUG" = success && test "$POTATO" = success && test "$OFF" = success

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
